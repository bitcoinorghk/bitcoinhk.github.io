<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Flag JS early so scroll-reveal hides content only when JS can reveal it -->
  <script>document.documentElement.className += ' js';</script>

  <title>{% if page.title %}{{ page.title }} — BAHK{% else %}{{ site.title }}{% endif %}</title>

  {% if page.excerpt %}
  <meta name="description" content="{{ page.excerpt | strip_html }}">
  {% else %}
  <meta name="description" content="{{ site.description }}">
  {% endif %}

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Slick Carousel -->
  <link rel="stylesheet" href="/styles/slick.css">
  <link rel="stylesheet" href="/styles/slick-theme.css">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="/styles/style.css">

  <!-- Accent colour (from _config.yml) -->
  <style>
    :root { --btc: {{ site.accent }}; --btc-dark: color-mix(in srgb, {{ site.accent }}, black 12%); }
  </style>

  <!-- Atom feed -->
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.baseurl }}/atom.xml">

  <!-- Icons -->
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F7931A">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="/media/press/bahk-logo-big-256x256.png">
  <meta property="og:type" content="website">

  <!-- Lightning address for Alby -->
  <meta name="lightning" content="lnurlp:donate@bitcoin.org.hk">
</head>
