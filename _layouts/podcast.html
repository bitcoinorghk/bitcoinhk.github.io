---
layout: default
---

<div class="post-header">
  <div class="c">
    <h1>{{ page.title }}</h1>
    <p class="lead">{% if page.episode_title %}{{ page.episode_title }}{% endif %}</p>
  </div>
</div>

<div id="details">
  <div class="c">
    <p class="lead">{% if page.author %}By +{{ page.author }} on {% endif %}{{ page.date | date: '%-d %B, %Y' }}</p>
  </div>
</div>

<section class="post">
  <div class="c">
    <article class="post-content">
      {{ content }}
    </article>
  </div>
</section>
